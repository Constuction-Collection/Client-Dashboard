<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Sourcing Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f8f7f5;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 30px;
    }

    .header-logo {
      height: 70px;
      display: flex;
      align-items: center;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .header-logo img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .header-title {
      flex: 1;
    }

    .company-name {
      color: #888;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    h1 {
      color: #ffffff;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: -0.5px;
    }

    .project-selector {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .project-selector label {
      font-weight: 500;
      color: #e0e0e0;
      font-size: 15px;
    }

    .project-selector select {
      padding: 12px 16px;
      border: 1px solid #2d7a7a;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background: white;
      color: #1a1a1a;
      transition: all 0.2s ease;
    }

    .project-selector select:hover,
    .project-selector select:focus {
      border-color: #2d7a7a;
      box-shadow: 0 0 0 3px rgba(45, 122, 122, 0.1);
    }

    .project-selector {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .project-selector-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .project-selector label {
      font-weight: 500;
      color: #e0e0e0;
      font-size: 15px;
      padding-top: 13px;
    }

    .project-selector select {
      padding: 12px 16px;
      border: 1px solid #2d7a7a;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background: white;
      color: #1a1a1a;
      transition: all 0.2s ease;
    }

    .project-selector select:hover,
    .project-selector select:focus {
      border-color: #2d7a7a;
      box-shadow: 0 0 0 3px rgba(45, 122, 122, 0.1);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .action-btn {
      padding: 12px 20px;
      background: #2d7a7a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #245f5f;
      box-shadow: 0 4px 12px rgba(45, 122, 122, 0.3);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 50px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 24px;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 35px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
      letter-spacing: -0.3px;
    }

    .option-count-badge {
      background: #f0fafb;
      color: #2d7a7a;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .option-item {
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 30px;
      background: #fafaf9;
      transition: all 0.3s ease;
    }

    .option-item:hover {
      border-color: #2d7a7a;
      background: #f0fafb;
    }

    .option-item.selected {
      background: #f0fafb;
    }

    .option-item.selected .option-header {
      color: #2d7a7a;
    }

    .option-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .product-name {
      font-weight: 600;
      color: #333;
      flex: 1;
    }

    .select-btn {
      padding: 10px 20px;
      background: #2d7a7a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      font-size: 14px;
    }

    .select-btn:hover {
      background: #246565;
      box-shadow: 0 4px 12px rgba(45, 122, 122, 0.3);
    }

    .select-btn.selected {
      background: #2d7a7a;
    }

    .product-thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      justify-content: center;
    }

    .product-thumbnail {
      width: 60px;
      height: 60px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafaf9;
    }

    .product-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-thumbnail:hover {
      border-color: #2d7a7a;
      box-shadow: 0 2px 8px rgba(45, 122, 122, 0.2);
    }

    .product-thumbnail.active {
      border-color: #2d7a7a;
      box-shadow: 0 0 0 2px rgba(45, 122, 122, 0.3);
    }

    .images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin: 30px 0;
    }

    .image-box {
      background: #fafaf9;
      border-radius: 10px;
      overflow: hidden;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .image-label {
      font-size: 13px;
      color: #888;
      text-align: center;
      font-weight: 400;
      display: block !important;
    }

    .images > div > .image-label:first-child {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .images > div > .image-label:last-child {
      margin-top: 12px;
    }

    .product-thumbnails {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
    }

    .product-thumbnail {
      width: 60px;
      height: 60px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .product-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-thumbnail.active {
      border-color: #2d7a7a;
      box-shadow: 0 0 0 2px rgba(45, 122, 122, 0.3);
    }

    .product-thumbnail:hover {
      border-color: #2d7a7a;
    }

    .option-item-content {
      display: flex;
      flex-direction: column;
    }

    .product-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .info-row {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 15px;
      color: #1a1a1a;
      font-weight: 400;
    }

    .client-notes-textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      transition: all 0.2s ease;
    }

    .client-notes-textarea:focus {
      outline: none;
      border-color: #2d7a7a;
      box-shadow: 0 0 0 3px rgba(45, 122, 122, 0.1);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.8px;
    }

    .room-spec {
      background: #f8f7f5;
      border-left: 3px solid #2d7a7a;
      padding: 16px 20px;
      margin: 20px 0;
      border-radius: 8px;
    }

    .notes-section {
      background: #f9f8f6;
      border-left: 3px solid #d9a574;
      padding: 16px 20px;
      margin: 20px 0;
      border-radius: 8px;
    }

    .pricing-section {
      background: #f9fafb;
      border-left: 3px solid #2d7a7a;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      font-size: 15px;
    }

    .price-row span:first-child {
      color: #666;
    }

    .price-row span:last-child {
      color: #1a1a1a;
      font-weight: 500;
    }

    .cost-selection {
      margin-top: 30px;
      padding: 20px;
      background: #f8f7f5;
      border-radius: 8px;
    }

    .cost-selection-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .cost-option {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .cost-option input[type="radio"] {
      margin-right: 10px;
      cursor: pointer;
    }

    .cost-option label {
      cursor: pointer;
      flex: 1;
      margin: 0;
    }

    .my-notes {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .my-notes-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .my-notes-content {
      font-size: 15px;
      color: #1a1a1a;
      line-height: 1.5;
    }

    .main-wrapper {
      display: flex;
      gap: 30px;
      margin-top: 30px;
    }

    .sidebar {
      position: sticky;
      top: 20px;
      width: 260px;
      height: fit-content;
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.8px;
    }

    .sidebar-list {
      list-style: none;
      max-height: calc(100vh - 250px);
      overflow-y: auto;
    }

    .sidebar-list li {
      margin-bottom: 6px;
    }

    .sidebar-list button {
      width: 100%;
      padding: 11px 12px;
      background: #f5f5f5;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      color: #333;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .sidebar-list button:hover {
      background: #eef5f5;
      border-left-color: #2d7a7a;
    }

    .sidebar-list button.active {
      background: #eef5f5;
      border-left-color: #2d7a7a;
      font-weight: 600;
      color: #2d7a7a;
    }

    .sidebar-list button.selected {
      background: #4a8f96;
      border-left-color: #2d7a7a;
      font-weight: 600;
      color: white;
    }

    .sidebar-list button.partial {
      background: #cfe6e6;
      border-left-color: #2d7a7a;
      font-weight: 600;
      color: #2d7a7a;
    }

    .content-wrapper {
      flex: 1;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 50px;
      margin-bottom: 50px;
    }

    .summary {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .summary h2 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #1a1a1a;
      font-weight: 400;
      letter-spacing: -0.3px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 15px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #666;
      font-weight: 400;
    }

    .summary-value {
      font-weight: 600;
      color: #1a1a1a;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 20px 0;
      margin-top: 20px;
      border-top: 1px solid #e0e0e0;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .total-savings {
      color: #2d7a7a;
    }

    .room-section {
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    .room-section-title {
      font-size: 24px;
      font-weight: 600;
      color: #2d7a7a;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 12px;
      border-bottom: 2px solid #2d7a7a;
    }

    .product-card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .summary-section {
      margin-top: 50px;
    }

    .summary-header {
      font-size: 24px;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 30px;
      letter-spacing: -0.3px;
    }

    .summary-items {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 15px 20px;
      background: #f8f7f5;
      border-radius: 8px;
      border-left: 4px solid #2d7a7a;
    }

    .summary-item-name {
      color: #1a1a1a;
      font-weight: 500;
    }

    .summary-item-price {
      color: #1a1a1a;
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 40px;
    }

    .btn {
      flex: 1;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary {
      background: #2d7a7a;
      color: white;
    }

    .btn-primary:hover {
      background: #245f5f;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45, 122, 122, 0.2);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .header {
        padding: 25px;
      }

      h1 {
        font-size: 28px;
      }

      .card {
        padding: 25px;
      }

      .images {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .image-box {
        height: 250px;
      }

      .product-info {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="header-logo">
          <img src="/cc-logo.png" alt="Construction Collection">
        </div>
        <div class="header-title">
          <div class="company-name">Construction Collection</div>
          <h1 id="pageTitle">Product Sourcing</h1>
        </div>
      </div>
      <div class="project-selector">
        <label for="projectSelect">Select Project:</label>
        <div class="project-selector-controls">
          <select id="projectSelect" onchange="changeProject()">
            <option value="">-- Choose a project --</option>
          </select>
          <button class="action-btn" onclick="generateShareLink()">Share Project</button>
        </div>
      </div>
    </div>

    <div class="main-wrapper" id="mainWrapper">
      <div class="sidebar">
        <div class="sidebar-title">Rooms</div>
        <ul class="sidebar-list" id="sidebarList"></ul>
      </div>
      <div class="content-wrapper">
        <div id="dashboardContent"></div>
        <div class="summary" id="summary" style="display: none;">
          <h2>Project Summary</h2>
          <div id="summaryContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin === 'http://localhost:3000'
      ? 'http://localhost:3000/api'
      : 'https://client-dashboard-ugki.onrender.com/api';

    let currentEmail = '';
    let currentProject = '';
    let groupedProducts = {};
    let selectedProducts = {};
    let costSelection = {};
    let roomIndexMap = [];

    // Returns the room name for a product, or 'Unassigned' when blank
    function getRoomName(product) {
      let room = getFieldValue(product, 'Room (from Competitor\'s Products)');
      if (Array.isArray(room)) room = room.filter(Boolean).join(', ');
      room = (room === null || room === undefined) ? '' : String(room).trim();
      return room || 'Unassigned';
    }

    // Alphabetical, with 'Unassigned' always last
    function sortRoomNames(names) {
      return names.slice().sort((a, b) => {
        if (a === 'Unassigned') return 1;
        if (b === 'Unassigned') return -1;
        return a.localeCompare(b);
      });
    }

    function getImageUrl(images) {
      if (!images) return null;
      if (Array.isArray(images)) {
        return images[0]?.url || null;
      }
      return images.url || null;
    }

    function getFieldValue(record, fieldName) {
      if (!record.fields) return null;
      return record.fields[fieldName] || null;
    }

    function switchCompetitorImage(index, imageIdx) {
      const options = Object.values(groupedProducts).flat();
      const option = options.find(o => options.indexOf(o) === index);
      if (!option) return;

      const competitorImages = getFieldValue(option.product, 'Competitor Product Images');
      if (!competitorImages || !Array.isArray(competitorImages)) return;

      const mainImg = document.getElementById(`competitorImg-${index}`);
      if (mainImg) {
        mainImg.src = competitorImages[imageIdx].url;
      }

      const thumbnails = document.querySelectorAll(`#competitorThumbnails-${index} .product-thumbnail`);
      thumbnails.forEach((thumb, idx) => {
        thumb.classList.toggle('active', idx === imageIdx);
      });
    }

    function switchMyImage(index, imageIdx) {
      const options = Object.values(groupedProducts).flat();
      const option = options.find(o => options.indexOf(o) === index);
      if (!option) return;

      const myImages = getFieldValue(option.product, 'My Product Photos');
      if (!myImages || !Array.isArray(myImages)) return;

      const mainImg = document.getElementById(`myImg-${index}`);
      if (mainImg) {
        mainImg.src = myImages[imageIdx].url;
      }

      const thumbnails = document.querySelectorAll(`#myThumbnails-${index} .product-thumbnail`);
      thumbnails.forEach((thumb, idx) => {
        thumb.classList.toggle('active', idx === imageIdx);
      });
    }

    async function fetchProjects() {
      const params = new URLSearchParams(window.location.search);
      currentEmail = params.get('email');
      const urlProject = params.get('project');

      if (!currentEmail) {
        document.getElementById('dashboardContent').innerHTML = '<div class="error">Please login with your email first.</div>';
        return;
      }

      // Fetch ONLY this client's projects (filtered by email).
      // A failure here must not stop a project supplied in the URL from loading.
      try {
        const response = await fetch(`${API_URL}/client-projects?email=${encodeURIComponent(currentEmail)}`);
        if (!response.ok) throw new Error('Failed to fetch projects');

        const projects = await response.json();
        populateProjectDropdown(projects);
      } catch (error) {
        console.error('Error loading project list:', error);
        if (!urlProject) {
          document.getElementById('dashboardContent').innerHTML = `<div class="error">Error loading projects: ${error.message}</div>`;
          return;
        }
      }

      // If a project is in the URL, preselect it and load its products
      if (urlProject) {
        selectProjectInDropdown(urlProject);
        loadDashboard(urlProject);
      }
    }

    function populateProjectDropdown(projects) {
      const select = document.getElementById('projectSelect');

      projects.forEach(project => {
        const option = document.createElement('option');
        const projectName = typeof project === 'string' ? project : project.name;
        option.value = projectName;
        option.textContent = projectName;
        select.appendChild(option);
      });
    }

    // Select a project in the dropdown, adding it if the list didn't include it
    function selectProjectInDropdown(projectName) {
      const select = document.getElementById('projectSelect');
      const exists = Array.from(select.options).some(opt => opt.value === projectName);

      if (!exists) {
        const option = document.createElement('option');
        option.value = projectName;
        option.textContent = projectName;
        select.appendChild(option);
      }

      select.value = projectName;
    }

    function changeProject() {
      const selectedProject = document.getElementById('projectSelect').value;

      if (selectedProject) {
        loadDashboard(selectedProject);

        // Keep the email in the URL so a refresh still authenticates
        const query = currentEmail
          ? `?email=${encodeURIComponent(currentEmail)}&project=${encodeURIComponent(selectedProject)}`
          : `?project=${encodeURIComponent(selectedProject)}`;
        window.history.pushState({}, '', query);
      }
    }

    async function loadDashboard(projectName) {
      currentProject = projectName;
      selectedProducts = {};
      costSelection = {};

      // Update page title with project name
      document.getElementById('pageTitle').textContent = currentProject;

      try {
        document.getElementById('dashboardContent').innerHTML = '<div class="loading">Loading dashboard...</div>';

        const response = await fetch(`${API_URL}/products?email=${encodeURIComponent(currentEmail)}&project=${encodeURIComponent(currentProject)}`);
        if (!response.ok) throw new Error('Failed to load products');

        const products = await response.json();
        groupedProducts = {};

        products.forEach(product => {
          const groupName = getFieldValue(product, 'Competitor_Product_Name_Text') || 'Unknown Group';
          if (!groupedProducts[groupName]) {
            groupedProducts[groupName] = [];
          }
          groupedProducts[groupName].push({ product, index: products.indexOf(product) });
        });

        renderDashboard();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('dashboardContent').innerHTML = `<div class="error">Error loading dashboard: ${error.message}</div>`;
      }
    }

    function renderDashboard() {
      let html = `<div class="dashboard">`;

      let productSidebarHtml = '';

      // Group the product cards by room
      const roomGroups = {};
      Object.entries(groupedProducts).forEach(([groupName, options]) => {
        const roomName = getRoomName(options[0].product);
        if (!roomGroups[roomName]) roomGroups[roomName] = [];
        roomGroups[roomName].push([groupName, options]);
      });

      const roomNames = sortRoomNames(Object.keys(roomGroups));
      roomIndexMap = roomNames.map(roomName => ({
        roomName: roomName,
        groupNames: roomGroups[roomName].map(entry => entry[0])
      }));

      roomNames.forEach((roomName, roomIdx) => {
        productSidebarHtml += `<li><button class="sidebar-item" data-room-index="${roomIdx}" onclick="scrollToRoom(${roomIdx})">${roomName}</button></li>`;

        html += `
          <div class="room-section" id="room-section-${roomIdx}">
            <div class="room-section-title">${roomName}</div>`;

      roomGroups[roomName].forEach(([groupName, options]) => {
        const selectedCount = selectedProducts[groupName] ? selectedProducts[groupName].length : 0;

        html += `
          <div class="product-card">
            <div class="card-header">
              <span class="option-count-badge">Select from ${options.length}</span>
            </div>
            <div class="options-container" id="options-${groupName}">`;

        options.forEach(({ product, index }) => {
          const productName = getFieldValue(product, 'My Product Suggestion') || 'Unknown Product';

          const price = parseFloat(getFieldValue(product, 'My Retail Price + GST')) || 0;
          const budgetPrice = parseFloat(getFieldValue(product, 'Competitor Quoted Price + GST')) || 0;
          const quantity = parseFloat(getFieldValue(product, 'Competitor Product Quantity')) || 1;
          const room = getFieldValue(product, 'Room (from Competitor\'s Products)') || '';
          const mySize = getFieldValue(product, 'My Size') || '';
          const competitorSize = getFieldValue(product, 'Competitor_Product_Size') || '';
          const myImages = getFieldValue(product, 'My Product Photos');
          const competitorImages = getFieldValue(product, 'Competitor Product Images');
          const myNotes = getFieldValue(product, 'My Notes') || '';

          const totalPrice = price * quantity;
          const budgetTotal = budgetPrice * quantity;
          const isSelected = selectedProducts[groupName] && selectedProducts[groupName].includes(index);
          const optionClass = isSelected ? 'option-item selected' : 'option-item';

          html += `
            <div class="${optionClass}" id="product-${index}">
              <div class="option-header">
                <button class="select-btn ${isSelected ? 'selected' : ''}" onclick="toggleProduct(${index}, '${groupName}')">
                  ${isSelected ? '✓ Selected' : 'Select'}
                </button>
              </div>

              <div class="option-item-content">
                <div class="images">
                  <div>
                    <div class="image-label">Inspiration Image</div>
                    <div class="image-box" id="competitorImage-${index}">
                      ${competitorImages ? `<img src="${getImageUrl(competitorImages)}" alt="Inspiration" id="competitorImg-${index}">` : '<div style="color: #ccc;">No Image</div>'}
                    </div>
                    ${competitorImages && Array.isArray(competitorImages) && competitorImages.length > 1 ? `
                      <div class="product-thumbnails" id="competitorThumbnails-${index}">
                        ${competitorImages.map((img, imgIdx) => `
                          <div class="product-thumbnail ${imgIdx === 0 ? 'active' : ''}" onclick="switchCompetitorImage(${index}, ${imgIdx})" title="Image ${imgIdx + 1}">
                            <img src="${img.url}" alt="Image ${imgIdx + 1}">
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                  <div>
                    <div class="image-label">${productName}</div>
                    <div class="image-box" id="myImage-${index}">
                      ${myImages ? `<img src="${getImageUrl(myImages)}" alt="My Product" id="myImg-${index}">` : '<div style="color: #ccc;">No Image</div>'}
                    </div>
                    ${myImages && Array.isArray(myImages) && myImages.length > 1 ? `
                      <div class="product-thumbnails" id="myThumbnails-${index}">
                        ${myImages.map((img, imgIdx) => `
                          <div class="product-thumbnail ${imgIdx === 0 ? 'active' : ''}" onclick="switchMyImage(${index}, ${imgIdx})" title="Image ${imgIdx + 1}">
                            <img src="${img.url}" alt="Image ${imgIdx + 1}">
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>
                </div>

                ${room ? `
                  <div class="room-spec">
                    <div class="section-label">Room Specification</div>
                    ${room}
                  </div>
                ` : ''}

                ${mySize || competitorSize ? `
                  <div class="room-spec">
                    <div style="display: flex; gap: 0;">
                      <div style="flex: 1; padding-right: 20px; border-right: 1px solid #e0e0e0;">
                        <div class="section-label">Specified Size</div>
                        <div>${competitorSize || ''}</div>
                      </div>
                      <div style="flex: 1; padding-left: 20px;">
                        <div class="section-label">My Size</div>
                        <div>${mySize || ''}</div>
                      </div>
                    </div>
                  </div>
                ` : ''}

                ${myNotes ? `
                  <div class="notes-section">
                    <div class="section-label">My Notes</div>
                    <div>${myNotes}</div>
                  </div>
                ` : ''}

                <div class="notes-section">
                  <div class="section-label">Your Notes</div>
                  <textarea
                    id="clientNotes-${index}"
                    class="client-notes-textarea"
                    placeholder="Add your notes here..."
                    onblur="saveClientNotes(${index}, '${groupName}')"
                  ></textarea>
                </div>

                <div class="pricing-section">
                  <div class="section-label">Pricing</div>
                  <div class="price-row">
                    <span>Your Price per Unit:</span>
                    <span>$${price.toFixed(2)}</span>
                  </div>
                  <div class="price-row">
                    <span>Budgeted Price per Unit:</span>
                    <span>$${budgetPrice.toFixed(2)}</span>
                  </div>
                  <div class="price-row" style="border-top: 1px solid #e0e0e0; padding-top: 8px; margin-top: 8px;">
                    <span><strong>Your Total Price:</strong></span>
                    <span><strong>$${totalPrice.toFixed(2)}</strong></span>
                  </div>
                  <div class="price-row">
                    <span><strong>Budgeted Total Price:</strong></span>
                    <span><strong>$${budgetTotal.toFixed(2)}</strong></span>
                  </div>
                </div>
              </div>
            </div>`;
        });

        html += `
          </div>
        </div>`;
      });

        html += `
          </div>`;
      });

      html += `</div>`;

      document.getElementById('dashboardContent').innerHTML = html;
      document.getElementById('sidebarList').innerHTML = productSidebarHtml;
      updateSidebarSelection();
      updateSummary();
    }

    function scrollToRoom(roomIdx) {
      setTimeout(() => {
        const section = document.getElementById(`room-section-${roomIdx}`);
        if (section) {
          section.scrollIntoView({ behavior: 'smooth', block: 'start' });

          document.querySelectorAll('.sidebar-item').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-room-index') == roomIdx) {
              btn.classList.add('active');
            }
          });
        }
      }, 100);
    }

    function scrollToProduct(index) {
      setTimeout(() => {
        const productElement = document.getElementById(`product-${index}`);
        if (productElement) {
          productElement.scrollIntoView({ behavior: 'smooth', block: 'start' });

          // Update active state in sidebar
          document.querySelectorAll('.sidebar-item').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-product-index') == index) {
              btn.classList.add('active');
            }
          });
        }
      }, 100);
    }

    function toggleProduct(index, groupName) {
      if (!selectedProducts[groupName]) {
        selectedProducts[groupName] = [];
      }

      const position = selectedProducts[groupName].indexOf(index);
      if (position > -1) {
        selectedProducts[groupName].splice(position, 1);
      } else {
        selectedProducts[groupName].push(index);
      }

      renderDashboard();
      updateSidebarSelection();
      updateSummary();
    }

    function setOptionForCost(groupName, index) {
      costSelection[groupName] = index;
      updateSummary();
    }

    // Look up a product record by its index
    function getProductByIndex(index) {
      const options = Object.values(groupedProducts).flat();
      const option = options.find(o => o.index === index);
      return option ? option.product : null;
    }

    function updateSummary() {
      const summary = document.getElementById('summary');
      const summaryContent = document.getElementById('summaryContent');
      if (!summary || !summaryContent) return;

      let totalYourPrice = 0;
      let totalBudgetPrice = 0;
      let selectedCount = 0;
      let selectedItems = [];
      let costSelectionItems = {};

      // Collect all samples
      Object.keys(selectedProducts).forEach(groupName => {
        const selectedIndices = selectedProducts[groupName];
        costSelectionItems[groupName] = selectedIndices;

        selectedIndices.forEach(index => {
          const product = getProductByIndex(index);
          const productName = product ? (getFieldValue(product, 'My Product Suggestion') || 'Unknown') : 'Unknown';
          selectedCount++;
          selectedItems.push({
            groupName: groupName,
            name: productName,
            index: index
          });
        });
      });

      // Calculate totals based on costSelection (one option per group)
      Object.keys(costSelectionItems).forEach(groupName => {
        const costIndex = costSelection[groupName];
        const indexToUse = costIndex !== undefined ? costIndex : costSelectionItems[groupName][0];

        const product = getProductByIndex(indexToUse);
        if (!product) return;

        const myPrice = parseFloat(getFieldValue(product, 'My Retail Price + GST')) || 0;
        const budgetPrice = parseFloat(getFieldValue(product, 'Competitor Quoted Price + GST')) || 0;
        const quantity = parseFloat(getFieldValue(product, 'Competitor Product Quantity')) || 1;

        totalYourPrice += myPrice * quantity;
        totalBudgetPrice += budgetPrice * quantity;
      });

      const totalSavings = totalBudgetPrice - totalYourPrice;
      const savingsPercent = totalBudgetPrice > 0 ? (totalSavings / totalBudgetPrice * 100).toFixed(1) : 0;

      let html = '<div class="summary-row"><span class="summary-label">Samples to Order:</span><span class="summary-value">' + selectedCount + '</span></div>';

      selectedItems.forEach(item => {
        html += `
          <div class="summary-row" style="padding-left: 20px; font-size: 13px;">
            <span class="summary-label">${item.groupName} - ${item.name}</span>
          </div>
        `;
      });

      html += '<div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #2d7a7a;"><div class="summary-label" style="margin-bottom: 15px; font-weight: 600; color: #1a1a1a;">Choose option for project total:</div>';

      // Show cost selection options (only if multiple options)
      Object.keys(costSelectionItems).forEach(groupName => {
        const selectedIndices = costSelectionItems[groupName];

        if (selectedIndices.length > 1) {
          html += `<div style="margin-bottom: 18px;"><div style="font-weight: 500; margin-bottom: 10px; color: #2d7a7a;">${groupName}</div>`;

          selectedIndices.forEach(index => {
            const product = getProductByIndex(index);
            const productName = product ? (getFieldValue(product, 'My Product Suggestion') || 'Unknown') : 'Unknown';
            const myPrice = product ? (parseFloat(getFieldValue(product, 'My Retail Price + GST')) || 0) : 0;
            const isSelected = costSelection[groupName] === index;

            html += `
              <div style="margin-left: 10px; margin-bottom: 8px;">
                <input type="radio" id="cost-option-${index}" name="cost-${groupName}" value="${index}" ${isSelected ? 'checked' : ''} onchange="setOptionForCost('${groupName}', ${index})">
                <label for="cost-option-${index}" style="margin-left: 8px; cursor: pointer; color: #333;">${productName} - $${myPrice.toFixed(2)}</label>
              </div>
            `;
          });
          html += '</div>';
        } else if (selectedIndices.length === 1 && costSelection[groupName] === undefined) {
          // Auto-select if only one option
          costSelection[groupName] = selectedIndices[0];
        }
      });

      html += '</div>';

      html += `
        <div class="total-row">
          <span>Total with Your Products:</span>
          <span>$${totalYourPrice.toFixed(2)}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Total Budgeted:</span>
          <span class="summary-value">$${totalBudgetPrice.toFixed(2)}</span>
        </div>
        <div class="total-row">
          <span>Total Project Savings:</span>
          <span class="total-savings">$${totalSavings.toFixed(2)} (${savingsPercent}%)</span>
        </div>
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
          <button onclick="downloadAndSubmit()" style="background: #2d7a7a; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; transition: all 0.2s;">
            📥 Download Summary & Submit
          </button>
        </div>
      `;

      summaryContent.innerHTML = html;
      summary.style.display = selectedCount > 0 ? 'block' : 'none';
    }

    function updateSidebarSelection() {
      document.querySelectorAll('.sidebar-item').forEach(btn => {
        const roomIdx = parseInt(btn.getAttribute('data-room-index'), 10);
        const entry = roomIndexMap[roomIdx];

        btn.classList.remove('selected', 'partial');
        if (!entry) return;

        const total = entry.groupNames.length;
        const done = entry.groupNames.filter(groupName =>
          selectedProducts[groupName] && selectedProducts[groupName].length > 0
        ).length;

        if (total > 0 && done === total) {
          btn.classList.add('selected');
        } else if (done > 0) {
          btn.classList.add('partial');
        }
      });
    }

    // Save client notes
    function saveClientNotes(index, groupName) {
      const textarea = document.getElementById(`clientNotes-${index}`);
      if (!textarea) return;

      const notes = textarea.value.trim();
      const options = Object.values(groupedProducts).flat();
      const option = options.find(o => o.index === index);
      if (!option) return;

      const productRecordId = option.product.id;

      fetch(`${API_URL}/save-product-notes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: currentEmail,
          projectName: currentProject,
          productRecordId: productRecordId,
          clientNotes: notes
        })
      })
      .then(res => res.json())
      .then(data => {
        if (!data.success) {
          console.error('Error saving notes:', data.error);
        }
      })
      .catch(err => console.error('Error:', err));
    }

    function switchCompetitorImage(index, imgIdx) {
      const options = Object.values(groupedProducts).flat();
      const product = options[index].product;
      const competitorImages = getFieldValue(product, 'Competitor Product Images');

      if (competitorImages && Array.isArray(competitorImages) && competitorImages[imgIdx]) {
        const mainImage = document.getElementById(`competitorImage-${index}`);
        if (mainImage) {
          mainImage.innerHTML = `<img src="${competitorImages[imgIdx].url}" alt="Inspiration">`;
        }

        const thumbnails = document.querySelectorAll(`#competitorThumbnails-${index} .product-thumbnail`);
        thumbnails.forEach((thumb, i) => {
          thumb.classList.toggle('active', i === imgIdx);
        });
      }
    }

    function switchMyImage(index, imgIdx) {
      const options = Object.values(groupedProducts).flat();
      const product = options[index].product;
      const myImages = getFieldValue(product, 'My Product Photos');

      if (myImages && Array.isArray(myImages) && myImages[imgIdx]) {
        const mainImage = document.getElementById(`myImg-${index}`);
        if (mainImage) {
          mainImage.innerHTML = `<img src="${myImages[imgIdx].url}" alt="My Product">`;
        }

        const thumbnails = document.querySelectorAll(`#myThumbnails-${index} .product-thumbnail`);
        thumbnails.forEach((thumb, i) => {
          thumb.classList.toggle('active', i === imgIdx);
        });
      }
    }

    async function downloadAndSubmit() {
      if (Object.keys(selectedProducts).length === 0 || Object.values(selectedProducts).every(arr => arr.length === 0)) {
        alert('Please select at least one product option.');
        return;
      }

      try {
        const selectedData = {};
        Object.entries(selectedProducts).forEach(([groupName, indices]) => {
          selectedData[groupName] = indices.map(idx => {
            const options = groupedProducts[groupName];
            const { product } = options[idx];
            return {
              name: getFieldValue(product, 'My Product Suggestion') || 'Unknown',
              myPrice: parseFloat(getFieldValue(product, 'My Retail Price + GST')) || 0,
              budgetPrice: parseFloat(getFieldValue(product, 'Competitor Quoted Price + GST')) || 0,
              quantity: parseFloat(getFieldValue(product, 'Competitor Product Quantity')) || 1
            };
          });
        });

        const response = await fetch(`${API_URL}/generate-summary`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentEmail,
            project: currentProject,
            selectedProducts: selectedData
          })
        });

        if (!response.ok) throw new Error('Failed to generate PDF');

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentProject}-sourcing.pdf`;
        a.click();

        alert('PDF generated and email sent successfully!');
      } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
      }
    }

    fetchProjects();

    // Export to PDF
    function exportPDF() {
      const projectName = document.getElementById('projectSelect').value;
      if (!projectName) {
        alert('Please select a project first');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');

      window.location.href = `/api/generate-summary?email=${encodeURIComponent(email)}&project=${encodeURIComponent(projectName)}&excludePricing=true`;
    }

    // Generate share link
    function generateShareLink() {
      const projectName = document.getElementById('projectSelect').value;
      if (!projectName) {
        alert('Please select a project first');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');

      fetch(`${API_URL}/api/generate-share-link`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, project: projectName })
      })
      .then(res => res.json())
      .then(data => {
        if (data.shareUrl) {
          const url = data.shareUrl;
          navigator.clipboard.writeText(url).then(() => {
            alert(`Share link copied to clipboard!\n\n${url}`);
          }).catch(() => {
            alert(`Share link generated:\n\n${url}`);
          });
        } else {
          alert('Error generating share link');
        }
      })
      .catch(err => alert('Error: ' + err.message));
    }
  </script>
</body>
</html>
